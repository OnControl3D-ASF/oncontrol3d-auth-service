# Profile for fast tests: in-memory H2 instead of PostgreSQL.
# Test-only values (not real secrets, never used outside tests).
spring.datasource.url=jdbc:h2:mem:authtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=test-only-db-password
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
auth.jwt-secret=test-secret-key-with-at-least-256-bits-0123456789
auth.internal-token=test-internal-token-with-at-least-32-bytes-0123
