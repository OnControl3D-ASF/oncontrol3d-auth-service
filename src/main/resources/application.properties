spring.application.name=oncontrol-auth-service

# Server
server.port=${PORT:8082}

# Database (separate database `oncontrol_auth`, same server as clinical)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oncontrol_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA (ddl-auto=update like clinical; Flyway deferred)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false

# Shared secrets: validated at startup (AuthSecurityProperties). No defaults on purpose.
auth.jwt-secret=${JWT_SECRET:}
auth.internal-token=${AUTH_INTERNAL_TOKEN:}
