name: CI

# Quality pipeline for the Auth Service:
#   build -> unit + integration tests (JUnit, MockMvc, Testcontainers) -> JaCoCo coverage gate (>= 70% lines)
# The JaCoCo check is bound to the `test` phase in pom.xml and FAILS the job below the threshold.

on:
  pull_request:
    branches: [main]
  workflow_call: # reusable by a future cicd.yml for main and release tags

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a delivery on main

jobs:
  # Renders deploy/k8s for dev and prod with placeholder values (same render.sh as the
  # deployment) and validates them: proves every variable is provided and the result is
  # schema-valid. See deploy/validate.sh.
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render and validate (dev, prod)
        run: deploy/validate.sh

  build-test:
    name: Build, test & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests need Docker (Testcontainers starts PostgreSQL 16); ubuntu-latest provides it.
      - name: Build, tests and coverage gate
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          missed = sum(int(r["LINE_MISSED"]) for r in rows)
          covered = sum(int(r["LINE_COVERED"]) for r in rows)
          print(f"### Line coverage: {covered / (missed + covered):.1%} ({covered}/{missed + covered}) - gate: 70%")
          EOF
          fi

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
